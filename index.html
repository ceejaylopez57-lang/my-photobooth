<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>SnapBox Photo Booth</title>

<style>
*{
    box-sizing:border-box;
}

body{
    margin:0;
    font-family:Arial,sans-serif;
    background:#f3f3f3;
    color:#111;
}

header{
    text-align:center;
    padding:20px 10px;
}

header h1{
    margin:0;
    font-size:30px;
}

header p{
    color:#777;
    margin:6px 0;
}

.app{
    width:min(1200px,95%);
    margin:auto;
    padding-bottom:50px;
}

.main{
    display:grid;
    grid-template-columns:1fr 380px;
    gap:18px;
}

.card{
    background:white;
    border-radius:18px;
    padding:15px;
    box-shadow:0 8px 25px #0001;
    margin-bottom:15px;
}

.camera{
    position:relative;
    background:#111;
    border-radius:14px;
    overflow:hidden;
}

video{
    width:100%;
    aspect-ratio:4/3;
    display:block;
    object-fit:cover;
}

.noMirror{
    transform:none !important;
}

#flash{
    position:absolute;
    inset:0;
    background:white;
    opacity:0;
    pointer-events:none;
}

.flash{
    animation:flash .25s;
}

@keyframes flash{
    0%{opacity:.9}
    100%{opacity:0}
}

#countdown{
    position:absolute;
    inset:0;
    display:none;
    align-items:center;
    justify-content:center;
    background:#0006;
    color:white;
    font-size:90px;
    font-weight:bold;
}

#countdown.show{
    display:flex;
}

button,
label.file{
    border:0;
    padding:10px 13px;
    border-radius:10px;
    background:#eee;
    cursor:pointer;
    font-weight:bold;
}

button:hover,
label.file:hover{
    opacity:.8;
}

.primary{
    background:#111;
    color:white;
}

.danger{
    background:#ffe1e1;
    color:#a00;
}

.controls{
    display:flex;
    flex-wrap:wrap;
    gap:7px;
    margin-top:10px;
}

.controls button,
.controls label{
    flex:1;
    min-width:100px;
    text-align:center;
}

input[type=file]{
    display:none;
}

select,
input[type=text],
input[type=color]{
    width:100%;
    padding:10px;
    border:1px solid #ddd;
    border-radius:9px;
    background:white;
}

input[type=range]{
    width:100%;
}

label.small{
    display:block;
    margin-top:12px;
    margin-bottom:5px;
    font-size:12px;
    font-weight:bold;
    color:#777;
}

.slots{
    display:grid;
    grid-template-columns:repeat(4,1fr);
    gap:7px;
    margin-top:12px;
}

.slot{
    position:relative;
    aspect-ratio:1;
    background:#eee;
    border-radius:9px;
    overflow:hidden;
    display:flex;
    align-items:center;
    justify-content:center;
    color:#aaa;
    font-size:11px;
}

.slot img{
    width:100%;
    height:100%;
    object-fit:cover;
}

.slot span{
    position:absolute;
    top:4px;
    left:4px;
    background:#000b;
    color:white;
    padding:3px 5px;
    border-radius:5px;
    font-size:9px;
}

.slot button{
    position:absolute;
    bottom:4px;
    left:4px;
    right:4px;
    padding:5px;
    font-size:9px;
    background:#000b;
    color:white;
}

.tabs{
    display:flex;
    gap:5px;
    margin-bottom:12px;
}

.tab{
    flex:1;
    font-size:11px;
}

.tab.active{
    background:#111;
    color:white;
}

.panel{
    display:none;
}

.panel.active{
    display:block;
}

.options{
    display:grid;
    grid-template-columns:repeat(3,1fr);
    gap:6px;
}

.option{
    border:1px solid #ddd;
    background:white;
    font-size:11px;
}

.option.active{
    border:2px solid #111;
}

.preview{
    display:flex;
    justify-content:center;
    overflow:auto;
    padding:10px;
}

#strip{
    position:relative;
    width:300px;
    min-height:600px;
    padding:15px;
    background:white;
    overflow:hidden;
}

.title{
    text-align:center;
    font-size:20px;
    font-weight:bold;
    letter-spacing:2px;
    margin-bottom:12px;
}

.photos{
    display:flex;
    flex-direction:column;
    gap:8px;
}

.photo{
    position:relative;
    width:100%;
    aspect-ratio:1.15/1;
    overflow:hidden;
    background:#ddd;
    border-radius:5px;
    touch-action:none;
}

.photo img{
    width:100%;
    height:100%;
    object-fit:cover;
    display:block;
    pointer-events:none;
}

.footer{
    text-align:center;
    font-size:10px;
    margin-top:10px;
}

.gridLayout .photos{
    display:grid;
    grid-template-columns:1fr 1fr;
}

.gridLayout .photo{
    aspect-ratio:1;
}

.filmLayout .photo{
    aspect-ratio:1.6/1;
}

.bigLayout .photos{
    display:grid;
    grid-template-columns:1fr 1fr;
}

.bigLayout .photo:first-child{
    grid-column:1/-1;
    aspect-ratio:1.7/1;
}

.theme-minimal{
    background:white;
    color:#111;
}

.theme-dark{
    background:#181818;
    color:white;
}

.theme-pastel{
    background:#ffeef5;
    color:#754c5c;
}

.theme-film{
    background:#e8ddc9;
    color:#30281e;
}

.theme-sunset{
    background:linear-gradient(160deg,#fff0dc,#f5d2d9);
}

.theme-ocean{
    background:linear-gradient(160deg,#e8f8ff,#dce8ff);
}

.sticker,
.textItem{
    position:absolute;
    z-index:50;
    cursor:grab;
    touch-action:none;
    user-select:none;
}

.sticker{
    font-size:38px;
}

.textItem{
    font-size:22px;
    font-weight:bold;
}

.status{
    text-align:center;
    color:#777;
    font-size:12px;
    margin-top:8px;
}

.notice{
    color:#777;
    font-size:11px;
    line-height:1.4;
    margin-top:8px;
}

#toast{
    position:fixed;
    bottom:20px;
    left:50%;
    transform:translate(-50%,80px);
    background:#111;
    color:white;
    padding:11px 15px;
    border-radius:10px;
    opacity:0;
    transition:.2s;
    z-index:9999;
    font-size:12px;
}

#toast.show{
    opacity:1;
    transform:translate(-50%,0);
}

@media(max-width:850px){

    .main{
        grid-template-columns:1fr;
    }

    .previewCard{
        order:-1;
    }

}

@media(max-width:600px){

    .app{
        width:96%;
    }

    .slots{
        grid-template-columns:repeat(2,1fr);
    }

    header h1{
        font-size:25px;
    }

    button,
    label.file{
        padding:11px 9px;
    }

    #strip{
        width:290px;
    }

}
</style>
</head>

<div class="app">

<script>

const $ = s => document.querySelector(s);
const $$ = s => [...document.querySelectorAll(s)];

const video = $("#video");
const slots = $("#slots");
const photos = $("#photos");
const strip = $("#strip");

let stream = null;
let facing = "user";
let mirror = true;
let sound = true;

let selected = 0;

let photosData = [];
let photoState = [];

let items = [];

let layout = "vertical";
let theme = "minimal";

let history = [];
let future = [];


function defaultState(){

    return {
        zoom:1,
        x:50,
        y:50,
        rotate:0,
        flip:false,
        filter:"none",
        brightness:100,
        contrast:100,
        saturation:100
    };

}


function toast(text){

    const t = $("#toast");

    t.textContent = text;

    t.classList.add("show");

    clearTimeout(t.timer);

    t.timer = setTimeout(()=>{
        t.classList.remove("show");
    },2200);

}


async function startCamera(){

    try{

        if(stream){
            stream.getTracks().forEach(t=>t.stop());
        }

        stream = await navigator.mediaDevices.getUserMedia({

            video:{
                facingMode:facing,
                width:{ideal:1920},
                height:{ideal:1080}
            },

            audio:false

        });

        video.srcObject = stream;

    }
    catch{

        toast("Camera unavailable. You can still upload photos.");

    }

}


startCamera();


$("#switch").onclick = ()=>{

    facing = facing === "user"
        ? "environment"
        : "user";

    startCamera();

};


$("#mirror").onclick = ()=>{

    mirror = !mirror;

    $("#mirror").textContent =
        "🪞 Mirror: " + (mirror ? "ON" : "OFF");

    video.style.transform =
        mirror && facing === "user"
        ? "scaleX(-1)"
        : "none";

};


$("#sound").onclick = ()=>{

    sound = !sound;

    $("#sound").textContent =
        "🔊 Sound: " + (sound ? "ON" : "OFF");

};


$("#fullscreen").onclick = ()=>{

    document.querySelector(".camera")
        .requestFullscreen?.();

};


function beep(){

    if(!sound) return;

    try{

        const audio =
            new AudioContext();

        const osc =
            audio.createOscillator();

        const gain =
            audio.createGain();

        osc.frequency.value = 700;

        gain.gain.value = .04;

        osc.connect(gain);

        gain.connect(audio.destination);

        osc.start();

        osc.stop(audio.currentTime+.1);

    }catch{}

}


function sleep(ms){

    return new Promise(
        resolve => setTimeout(resolve,ms)
    );

}


async function countdown(){

    const seconds = +$("#timer").value;

    if(!seconds) return;

    const box = $("#countdown");

    box.classList.add("show");

    for(let i=seconds;i>0;i--){

        box.textContent = i;

        await sleep(1000);

    }

    box.textContent = "📸";

    beep();

    await sleep(250);

    box.classList.remove("show");

}


function takePhoto(){

    if(!video.videoWidth){

        toast("Camera is not ready.");

        return;

    }

    const canvas =
        document.createElement("canvas");

    canvas.width = video.videoWidth;
    canvas.height = video.videoHeight;

    const ctx =
        canvas.getContext("2d");

    if(mirror && facing === "user"){

        ctx.translate(canvas.width,0);
        ctx.scale(-1,1);

    }

    ctx.drawImage(
        video,
        0,
        0,
        canvas.width,
        canvas.height
    );

    $("#flash").classList.remove("flash");

    void $("#flash").offsetWidth;

    $("#flash").classList.add("flash");

    const image =
        canvas.toDataURL("image/jpeg",.95);

    addPhoto(image,selected);

}


function addPhoto(image,index){

    photosData[index] = image;

    photoState[index] = defaultState();

    selected =
        Math.min(index+1,6);

    render();

}


$("#capture").onclick = async ()=>{

    const max = +$("#shotCount").value;

    if(photosData.filter(Boolean).length >= max){

        toast("All slots are full.");

        return;

    }

    await countdown();

    takePhoto();

};


$("#booth").onclick = async ()=>{

    const max = +$("#shotCount").value;

    if(photosData.filter(Boolean).length >= max){

        toast("Reset or retake first.");

        return;

    }

    $("#booth").disabled = true;

    for(let i=0;i<max;i++){

        selected = i;

        await countdown();

        takePhoto();

        await sleep(700);

    }

    $("#booth").disabled = false;

    toast("Photo booth complete 📸");

};


$("#upload").onchange = e => {

    const files =
        [...e.target.files]
        .filter(f=>f.type.startsWith("image/"));

    let index = selected;

    files.forEach(file=>{

        if(index >= 6) return;

        const reader =
            new FileReader();

        reader.onload = ev => {

            photosData[index] =
                ev.target.result;

            photoState[index] =
                defaultState();

            index++;

            render();

        };

        reader.readAsDataURL(file);

    });

    e.target.value = "";

};


function renderSlots(){

    slots.innerHTML = "";

    for(let i=0;i<6;i++){

        const slot =
            document.createElement("div");

        slot.className = "slot";

        slot.innerHTML =
            `<span>${i+1}</span>`;

        if(photosData[i]){

            const img =
                document.createElement("img");

            img.src = photosData[i];

            slot.append(img);

            const btn =
                document.createElement("button");

            btn.textContent = "Select";

            btn.onclick = ()=>{
                selected=i;
                syncEditor();
            };

            slot.append(btn);

        }
        else{

            slot.append("Empty");

        }

        slots.append(slot);

    }

    const max =
        +$("#shotCount").value;

    $("#progress").textContent =
        `${photosData.slice(0,max).filter(Boolean).length} / ${max} photos`;

    $("#photoSelect").innerHTML =
        photosData.map(
            (_,i)=>`<option value="${i}">
                Photo ${i+1}
            </option>`
        ).join("");

};


function filterCSS(filter){

    const filters = {

        none:"none",

        bw:"grayscale(1)",

        vintage:
            "sepia(.45) contrast(.9)",

        warm:
            "sepia(.15) saturate(1.25)",

        cool:
            "hue-rotate(15deg) saturate(.85)",

        soft:
            "brightness(1.08) saturate(.8)"

    };

    return filters[filter] || "none";

}


function renderPreview(){

    strip.className =
        `theme-${theme}`;

    if(layout === "grid")
        strip.classList.add("gridLayout");

    if(layout === "film")
        strip.classList.add("filmLayout");

    if(layout === "big")
        strip.classList.add("bigLayout");


    strip.style.background =
        $("#bgColor").value;

    strip.style.padding =
        $("#padding").value+"px";


    $("#stripTitle").textContent =
        $("#title").value || "SNAPBOX";

    $("#stripFooter").textContent =
        $("#footerText").value ||
        "MADE WITH SNAPBOX 📸";


    photos.style.gap =
        $("#gap").value+"px";


    photos.innerHTML = "";


    let count =
        layout === "grid"
        ? 4
        : 6;


    for(let i=0;i<count;i++){

        const photo =
            document.createElement("div");

        photo.className = "photo";

        photo.dataset.index = i;

        photo.style.border =
            $("#border").value > 0
            ? `${$("#border").value}px solid ${$("#borderColor").value}`
            : "none";

        photo.style.borderRadius =
            $("#radius").value+"px";


        if(photosData[i]){

            const img =
                document.createElement("img");

            const state =
                photoState[i] ||
                defaultState();


            img.src =
                photosData[i];


            img.style.objectPosition =
                `${state.x}% ${state.y}%`;


            img.style.transform =
                `
                scaleX(${state.flip ? -1 : 1})
                rotate(${state.rotate}deg)
                scale(${state.zoom})
                `;


            img.style.filter =
                `
                ${filterCSS(state.filter)}
                brightness(${state.brightness}%)
                contrast(${state.contrast}%)
                saturate(${state.saturation}%)
                `;


            photo.append(img);

        }


        photo.onclick = ()=>{

            selected=i;

            syncEditor();

        };


        photos.append(photo);

    }


    renderItems();

}


function renderItems(){

    $$(".textItem,.sticker").forEach(
        e=>e.remove()
    );


    items.forEach((item,index)=>{

        const element =
            document.createElement("div");

        element.className =
            item.type === "text"
            ? "textItem"
            : "sticker";


        element.textContent =
            item.value;


        element.style.left =
            item.x+"%";

        element.style.top =
            item.y+"%";


        if(item.type === "text"){

            element.style.color =
                item.color;

            element.style.fontFamily =
                item.font;

            element.style.fontSize =
                item.size+"px";

        }


        element.onpointerdown =
            startDrag(element,item);


        photos.append(element);

    });

}


function startDrag(element,item){

    return e => {

        e.preventDefault();

        const startX=e.clientX;
        const startY=e.clientY;

        const oldX=item.x;
        const oldY=item.y;

        const rect =
            strip.getBoundingClientRect();


        const move = ev => {

            item.x =
                Math.max(
                    0,
                    Math.min(
                        95,
                        oldX+
                        ((ev.clientX-startX)/rect.width)*100
                    )
                );


            item.y =
                Math.max(
                    0,
                    Math.min(
                        95,
                        oldY+
                        ((ev.clientY-startY)/rect.height)*100
                    )
                );


            element.style.left =
                item.x+"%";

            element.style.top =
                item.y+"%";

        };


        const stop = ()=>{

            document.removeEventListener(
                "pointermove",
                move
            );

            document.removeEventListener(
                "pointerup",
                stop
            );

        };


        document.addEventListener(
            "pointermove",
            move
        );

        document.addEventListener(
            "pointerup",
            stop
        );

    };

}

/*
========================================
HD EXPORT
========================================

The important part:

The exported canvas is ALWAYS:

1080 × 1920

Images are drawn using object-cover
style calculations.

That means:

NO STRETCHING.

If the image does not fit,
the extra part is cropped.
*/


function loadImage(src){

    return new Promise((resolve,reject)=>{

        const img =
            new Image();

        img.onload =
            ()=>resolve(img);

        img.onerror =
            reject;

        img.src=src;

    });

}


function drawCover(
    ctx,
    img,
    x,
    y,
    width,
    height,
    state
){

    const scale =
        Math.max(
            width/img.naturalWidth,
            height/img.naturalHeight
        ) * state.zoom;


    const imageWidth =
        img.naturalWidth*scale;

    const imageHeight =
        img.naturalHeight*scale;


    const offsetX =
        x+
        (width-imageWidth)*
        (state.x/100);


    const offsetY =
        y+
        (height-imageHeight)*
        (state.y/100);


    ctx.save();

    ctx.beginPath();

    ctx.roundRect(
        x,
        y,
        width,
        height,
        +$("#radius").value
    );

    ctx.clip();


    ctx.translate(
        x+width/2,
        y+height/2
    );


    ctx.rotate(
        state.rotate*Math.PI/180
    );


    ctx.scale(
        state.flip ? -1 : 1,
        1
    );


    ctx.translate(
        -(x+width/2),
        -(y+height/2)
    );


    ctx.filter =
        `
        ${filterCSS(state.filter)}
        brightness(${state.brightness}%)
        contrast(${state.contrast}%)
        saturate(${state.saturation}%)
        `;


    ctx.drawImage(
        img,
        offsetX,
        offsetY,
        imageWidth,
        imageHeight
    );


    ctx.restore();

}


async function exportImage(){

    const canvas =
        document.createElement("canvas");

    /*
       ALWAYS 1080 × 1920
    */

    canvas.width=1080;
    canvas.height=1920;


    const ctx =
        canvas.getContext("2d");


    ctx.fillStyle =
        $("#bgColor").value;

    ctx.fillRect(
        0,
        0,
        1080,
        1920
    );


    /*
       TITLE
    */

    ctx.fillStyle =
        theme==="dark"
        ? "#fff"
        : "#111";

    ctx.font =
        "bold 50px Arial";

    ctx.textAlign="center";

    ctx.fillText(
        $("#title").value || "SNAPBOX",
        540,
        65
    );


    let positions;


    if(layout==="grid"){

        positions=[
            [50,100,475,475],
            [555,100,475,475],
            [50,585,475,475],
            [555,585,475,475]
        ];

    }

    else if(layout==="big"){

        positions=[
            [50,100,980,650],
            [50,765,475,475],
            [555,765,475,475],
            [50,1250,475,475],
            [555,1250,475,475]
        ];

    }

    else if(layout==="film"){

        positions=[
            [50,100,980,380],
            [50,490,980,380],
            [50,880,980,380],
            [50,1270,980,380],
            [50,1660,980,180]
        ];

    }

    else{

        positions=[
            [50,100,980,380],
            [50,490,980,380],
            [50,880,980,380],
            [50,1270,980,380],
            [50,1660,980,180]
        ];

    }


    for(
        let i=0;
        i<positions.length;
        i++
    ){

        if(!photosData[i])
            continue;


        const img =
            await loadImage(
                photosData[i]
            );


        drawCover(
            ctx,
            img,
            ...positions[i],
            photoState[i] ||
            defaultState()
        );


        const bw =
            +$("#border").value;


        if(bw>0){

            ctx.strokeStyle =
                $("#borderColor").value;

            ctx.lineWidth=bw;

            ctx.strokeRect(
                ...positions[i]
            );

        }

    }


    /*
       STICKERS + TEXT
    */

    for(const item of items){

        const x =
            item.x/100*1080;

        const y =
            item.y/100*1920;


        ctx.save();

        ctx.textAlign="left";


        if(item.type==="text"){

            ctx.fillStyle =
                item.color;

            ctx.font =
                `bold ${item.size*3.5}px ${item.font}`;

        }

        else{

            ctx.font =
                "120px Arial";

        }


        ctx.fillText(
            item.value,
            x,
            y
        );


        ctx.restore();

    }


    /*
       FOOTER
    */

    ctx.fillStyle =
        theme==="dark"
        ? "#fff"
        : "#111";

    ctx.font =
        "25px Arial";

    ctx.textAlign="center";

    ctx.fillText(
        $("#footerText").value ||
        "MADE WITH SNAPBOX 📸",
        540,
        1885
    );


    return new Promise(resolve=>{

        canvas.toBlob(
            blob=>resolve(blob),
            "image/png"
        );

    });

}


async function saveBlob(blob,name){

    const file =
        new File(
            [blob],
            name,
            {type:blob.type}
        );


    /*
       MOBILE:
       Open native Share Sheet
    */

    if(
        navigator.share &&
        navigator.canShare &&
        navigator.canShare({
            files:[file]
        })
    ){

        await navigator.share({

            title:"SnapBox Photo",

            files:[file]

        });

        return;

    }


    /*
       DESKTOP:
       Normal download
    */

    const url =
        URL.createObjectURL(blob);

    const a =
        document.createElement("a");

    a.href=url;

    a.download=name;

    document.body.appendChild(a);

    a.click();

    a.remove();

    setTimeout(
        ()=>URL.revokeObjectURL(url),
        3000
    );

}


$("#save").onclick = async ()=>{

    try{

        $("#save").disabled=true;

        toast("Rendering 1080×1920...");

        const blob =
            await exportImage();

        await saveBlob(
            blob,
            "SnapBox-1080x1920.png"
        );

        toast("Saved HD photo strip!");

    }
    catch(error){

        console.error(error);

        toast("Saving failed.");

    }

    $("#save").disabled=false;

};


$("#saveJpg").onclick = async ()=>{

    const png =
        await exportImage();

    /*
       Convert PNG to JPG
    */

    const img =
        await loadImage(
            URL.createObjectURL(png)
        );


    const canvas =
        document.createElement("canvas");

    canvas.width=1080;
    canvas.height=1920;

    const ctx =
        canvas.getContext("2d");

    ctx.fillStyle="white";

    ctx.fillRect(
        0,
        0,
        1080,
        1920
    );

    ctx.drawImage(
        img,
        0,
        0
    );


    canvas.toBlob(
        blob=>saveBlob(
            blob,
            "SnapBox-1080x1920.jpg"
        ),
        "image/jpeg",
        .94
    );

};

};

        i<photos.length;
        i++
    ){

        const response =
            await fetch(photos[i]);

        const blob =
            await response.blob();

        await saveBlob(
            blob,
            `SnapBox-photo-${i+1}.jpg`
        );

    }

};
