<script>
const STORE='tempo_schedule_v1', today=new Date(); today.setHours(0,0,0,0); const iso=d=>d.toISOString().slice(0,10); const dateToday=iso(today);

setTimeout(()=>{let add=$('#addTask');if(add)add.onclick=openTaskSheet},0);
const RECENT_ACCOUNTS='tempo_recent_accounts';function rememberAccount(user){if(!user?.email)return;let items=JSON.parse(localStorage.getItem(RECENT_ACCOUNTS)||'[]').filter(x=>x.email!==user.email);items.unshift({email:user.email,name:user.user_metadata?.full_name||user.email,lastUsed:Date.now()});localStorage.setItem(RECENT_ACCOUNTS,JSON.stringify(items.slice(0,3)))}const cloudLoadWithRecents=loadCloudState;loadCloudState=async function(){rememberAccount(cloud.user);return cloudLoadWithRecents()};function addRecentAccounts(){let form=$('#realAuthForm');if(!form||$('#recentAccounts'))return;let accounts=JSON.parse(localStorage.getItem(RECENT_ACCOUNTS)||'[]');if(!accounts.length)return;let markup='<div id="recentAccounts" style="margin:4px 0 15px"><label style="display:block;font-size:12px;font-weight:700;color:var(--muted);margin-bottom:7px">Recently used</label><div style="display:grid;gap:6px">'+accounts.map((a,i)=>'<button type="button" class="secondary recent-account" data-recent="'+i+'" style="text-align:left;display:flex;align-items:center;gap:9px"><span class="avatar" style="width:27px;height:27px">'+esc(a.name[0]?.toUpperCase()||'U')+'</span><span><b style="display:block">'+esc(a.name)+'</b><small style="color:var(--muted)">'+esc(a.email)+'</small></span></button>').join('')+'</div></div>';let submit=$('#authSubmit');submit.insertAdjacentHTML('beforebegin',markup);$$('.recent-account').forEach(button=>button.onclick=()=>{let account=accounts[+button.dataset.recent];$('#authEmail').value=account.email;$('#authPassword').focus();haptic()})}const authWithRecents=authScreen;authScreen=function(mode='login',msg=''){let result=authWithRecents(mode,msg);if(mode==='login')addRecentAccounts();return result};if(cloud.user)rememberAccount(cloud.user);
const themeMotion=document.createElement('style');themeMotion.textContent='body.theme-transition,body.theme-transition *,body.theme-transition *::before,body.theme-transition *::after{transition-property:background-color,color,border-color,box-shadow,fill,opacity!important;transition-duration:.32s!important;transition-timing-function:cubic-bezier(.2,.8,.2,1)!important}';document.head.append(themeMotion);document.addEventListener('click',e=>{if(e.target.closest('#themeBtn,#darkToggle')){document.body.classList.add('theme-transition');setTimeout(()=>document.body.classList.remove('theme-transition'),380)}},true);
let mainMenuGate=true;function showMainMenu(){auth.classList.remove('hidden','closing','booting');showWelcome();let login=$('#welcomeLogin'),signup=$('#welcomeSignup'),guest=$('#continueGuest');if(cloud.user){let name=cloud.user.user_metadata?.full_name||cloud.user.email;login.textContent='Continue as '+name.split(' ')[0];login.onclick=()=>{mainMenuGate=false;auth.classList.add('hidden');render();haptic()};signup.textContent='Switch Account';signup.onclick=()=>{mainMenuGate=false;authIntent=true;authScreen('login')};guest.style.display='none'}else{let oldLogin=login.onclick,oldSignup=signup.onclick,oldGuest=guest.onclick;login.onclick=()=>{mainMenuGate=false;oldLogin()};signup.onclick=()=>{mainMenuGate=false;oldSignup()};guest.onclick=()=>{mainMenuGate=false;oldGuest()}}}const menuLoader=loadCloudState;loadCloudState=async function(){let result=await menuLoader();if(mainMenuGate)showMainMenu();return result};showMainMenu();
const stableMenuStyle=document.createElement('style');stableMenuStyle.textContent='.authgate.force-main{display:grid!important;opacity:1!important;pointer-events:auto!important}';document.head.append(stableMenuStyle);const stableMenuBuilder=showMainMenu;showMainMenu=function(){stableMenuBuilder();auth.classList.add('force-main');let login=$('#welcomeLogin'),signup=$('#welcomeSignup'),guest=$('#continueGuest');if(cloud.user){login.onclick=()=>{mainMenuGate=false;auth.classList.remove('force-main');auth.classList.add('hidden');render();haptic()};signup.onclick=()=>{mainMenuGate=false;auth.classList.remove('force-main');authIntent=true;authScreen('login')}}else{let resumeLogin=login.onclick,resumeSignup=signup.onclick,resumeGuest=guest.onclick;login.onclick=()=>{auth.classList.remove('force-main');resumeLogin()};signup.onclick=()=>{auth.classList.remove('force-main');resumeSignup()};guest.onclick=()=>{auth.classList.remove('force-main');resumeGuest()}}};const authOutsideMenu=authScreen;authScreen=function(mode='login',msg=''){auth.classList.remove('force-main');return authOutsideMenu(mode,msg)};showMainMenu();
let deferredInstall;const installButton=document.createElement('button');installButton.className='secondary';installButton.id='installTempo';installButton.textContent='⇩ Install app';installButton.hidden=true;$('.actions').prepend(installButton);window.addEventListener('beforeinstallprompt',event=>{event.preventDefault();deferredInstall=event;installButton.hidden=false});installButton.onclick=async()=>{if(deferredInstall){deferredInstall.prompt();await deferredInstall.userChoice;deferredInstall=null;installButton.hidden=true}else toast('On iPhone: Share → Add to Home Screen')};window.addEventListener('appinstalled',()=>{installButton.hidden=true;toast('Tempo is installed')});if(location.protocol!=='file:'&&'serviceWorker' in navigator)navigator.serviceWorker.register('./tempo-sw.js').catch(()=>{});
